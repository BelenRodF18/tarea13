<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotora - Agregar auto</title>
    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body data-pagina="agregar">
    <div id="navbar"></div>
    <main class="contenedor">
        <div class="barra">
            <h1>Agregar auto</h1>
            <a class="btn secundario" href="index.html">← Volver al listado</a>
        </div>
        <div id="mensaje" class="mensaje"></div>

        <section class="tarjeta">
            <form id="form-auto" novalidate>
                <div class="fila-form">
                    <div class="campo"><label for="marca">Marca *</label><select id="marca" required></select></div>
                    <div class="campo"><label for="modelo">Modelo *</label><input id="modelo" maxlength="50" required></div>
                    <div class="campo"><label for="anio">Año *</label><input id="anio" type="number" min="1886" step="1" required></div>
                    <div class="campo"><label for="precio">Precio (US$) *</label><input id="precio" type="number" min="0" step="0.01" required></div>
                    <div class="campo"><label for="estado">Estado *</label>
                        <select id="estado" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="Nuevo">Nuevo</option>
                            <option value="Usado">Usado</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn">Guardar auto</button>
            </form>
        </section>
    </main>
    <script src="dist/js/api.js"></script>
    <script src="dist/js/util.js"></script>
    <script src="dist/js/components/navbar.js"></script>
    <script src="dist/js/pages/agregar.js"></script>
</body>
</html>
