services:

  # app
  app:
    build: .
    container_name: ${APP_NAME:-tarea13}_app
    ports:
      - "${APP_PORT:-8094}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  # db
  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-tarea13}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automotora}
      MYSQL_USER: ${MYSQL_USER:-usuario}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3311}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  # phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${APP_NAME:-tarea13}_phpmyadmin
    ports:
      - "${PMA_PORT:-8095}:80"
    environment:
      PMA_HOST: db
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
    depends_on:
      - db

volumes:
  db_data:
